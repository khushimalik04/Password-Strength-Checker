<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Password Strength Checker</h2>
        <div class="input-container">
            <input type="password" id="password" placeholder="Enter your password">
            <button id="toggle-visibility"><i class="fas fa-eye"></i></button>
        </div>
        <div id="password-strength">
            <div id="strength-bar"></div>
            <p id="strength-text"></p>
        </div>
        
        
        <div id="password-requirements">
            <ul>
                <li id="length-requirement"><span class="cross">❌</span> At least 8 characters</li>
                <li id="uppercase-requirement"><span class="cross">❌</span> Contains uppercase letter</li>
                <li id="lowercase-requirement"><span class="cross">❌</span> Contains lowercase letter</li>
                <li id="number-requirement"><span class="cross">❌</span> Contains number</li>
                <li id="special-requirement"><span class="cross">❌</span> Contains special character</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
